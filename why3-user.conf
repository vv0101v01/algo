[main]
magic = 14
datadir = "/home/user/.moon/share/why3"
libdir = "/home/user/.moon/lib/why3"
memlimit = 4000
running_provers_max = 8
timelimit = 60.000000

[partial_prover]
name = "Z3"
path = "/usr/bin/z3"
version = "4.13.3"

[partial_prover]
name = "CVC5"
path = "/usr/bin/cvc5"
version = "1.1.2"

[strategy]
code = "start:
c Z3,4.13.3 .2 1000
c Z3,4.13.3 1 1000
t compute_specified start
t split_vc start
c Z3,4.13.3 3 4000
c CVC5,1.1.2 20 4000
"
desc = "Automatic@ run@ of@ provers@ and@ most@ useful@ transformations"
name = "MoonBit_Auto"
shortcut = "4"
